<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>P17 review test</title></head>
<body style="font-family:Consolas,monospace;font-size:16px;padding:20px;background:#fff">
<h1>P17 AI review + gate + package test</h1>
<div id="r" style="white-space:pre-wrap;font-size:18px;color:#0f4c81">RUNNING…</div>
<script src="../src/core/review/review.core.js"></script>
<script>
const R=window.PaperParallelReview;
const pairs=[
 {enBlockId:'e1',zhBlockId:'z1',enText:'It achieves 18.3x speedup.',zhText:'它取得加速。'},
 {enBlockId:'e2',zhBlockId:'z2',enText:'The architecture reduces latency.',zhText:'该架构降低了延迟。'},
 {enBlockId:'e3',zhBlockId:'z3',enText:'Prior work uses GPUs.',zhText:'已有工作使用 GPU。'},
];
async function mockTranslate(ctx){
 if(ctx.enBlockId==='e1') return '```json\n{"issues":[{"severity":"error","blockId":"e1","message":"数字 18.3 漏译"}]}\n```';
 return '{"issues":[]}';
}
(async()=>{
 const checks=[];
 checks.push(['parseLlmJson 剥围栏', R.parseLlmJson('```json\n{"a":1}\n```').a===1]);
 const ai=await R.runAiReview(pairs,{translate:mockTranslate});
 checks.push(['AI 复审发现 1 error', ai.issues.filter(i=>i.severity==='error').length===1 && ai.pass===false]);
 const rule=[{id:'r1',kind:'rule',severity:'error',blockId:'e3',message:'译文污染',rule:'R7',resolved:false},{id:'r2',kind:'rule',severity:'warn',blockId:'e2',message:'术语格式',rule:'R6',resolved:false}];
 let comb=R.combineIssues(rule,ai.issues);
 checks.push(['合并后 2 个未消解 error', comb.unresolvedErrors===2]);
 checks.push(['消解前门禁不通过', R.isApproved(comb.issues)===false]);
 const errIds=comb.issues.filter(i=>i.severity==='error').map(i=>i.id);
 for(const id of errIds) R.resolveIssue(comb.issues,id,true);
 checks.push(['人工消解后门禁通过', R.isApproved(comb.issues)===true]);
 const pkg=R.buildProjectPackage({mode:'A',enDoc:{id:'en',blocks:[]},zhDoc:{id:'zh',blocks:[]},units:[{enBlockIds:['e1'],zhBlockIds:['z1']}],spans:[],terms:[],issues:comb.issues,auditPassed:true});
 const v=R.validateProjectPackage(pkg);
 checks.push(['项目包校验通过', v.ok===true&&v.errors.length===0]);
 const bad={...pkg,zhDoc:{id:'zh',blocks:[{id:'x',type:'paragraph',text:'tampered'}]}};
 const v2=R.validateProjectPackage(bad);
 checks.push(['篡改包校验失败', v2.ok===false&&v2.errors.some(e=>e.includes('checksum'))]);
 const fails=checks.filter(c=>!c[1]);
 document.getElementById('r').textContent=(fails.length?'FAIL '+fails.length+'\n':'ALL-PASS\n')+checks.map(c=>`${c[1]?'✅':'❌'} ${c[0]}`).join('\n')+'\nchecksum='+pkg.checksum+'\naiIssues='+JSON.stringify(ai.issues.map(i=>i.severity));
})().catch(e=>{document.getElementById('r').textContent='EXCEPTION '+e.message+'\n'+e.stack;});
</script>
</body>
</html>
