<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>P21 ZK-Tracer 完整译文采样测试</title></head>
<body style="font-family:Consolas,monospace;font-size:16px;padding:20px;background:#fff">
<h1>P21 ZK-Tracer 真实译文采样(取自本机 ZK-Tracer_中文翻译.html)</h1>
<div id="r" style="white-space:pre-wrap;font-size:17px;color:#0f4c81">RUNNING…</div>
<script src="../src/core/paginate/paginator.core.js"></script>
<script src="../src/core/translate/pipeline.core.js"></script>
<script src="../src/core/align/alignBlocks.core.js"></script>
<script>
const PG=window.PaperParallelPaginator, PL=window.PaperParallelPipeline, ALB=window.PaperParallelAlignBlocks;
const T='ZK-Tracer：一种面向零知识虚拟机轨迹生成的高性能异构加速器';
const blocks=[
 {id:'r01',type:'title',text:T,fontSize:17,widthMode:'span',frontMatter:true,order:0},
 {id:'r02',type:'authors',text:'Jieran Cui，Zhengkai Wen，Haowen Fang，Yinan Zhu，Jia Xiong，Cheng Ni，Mingchi Zhang，Nan Guan，Xi Wang',fontSize:11,widthMode:'span',frontMatter:true,order:1},
 {id:'r03',type:'abstract',text:'零知识虚拟机（Zero-Knowledge Virtual Machine, zkVM）是推动零知识证明（Zero-Knowledge Proof, ZKP）大规模应用的关键技术，但其性能瓶颈严重制约了其实用性。我们提出了 ZK-Tracer，即首个专门为 zkVM 前端设计的硬件加速器架构，由一个主轨迹单元（Main Trace Unit, MTU）与多个并行的置换轨迹单元（Permutation Trace Units, PTUs）组成。',fontSize:12,widthMode:'span',frontMatter:true,order:2},
 {id:'r04',type:'keywords',text:'零知识虚拟机（Zero-Knowledge Virtual Machine），硬件加速（Hardware Acceleration）',fontSize:11,widthMode:'span',frontMatter:true,order:3},
 {id:'r05',type:'section',text:'1 引言',fontSize:14,order:4},
 {id:'r06',type:'paragraph',text:'零知识证明（Zero-Knowledge Proofs, ZKPs）是构建下一代可信数字系统的基石。然而传统 ZKP 开发门槛极高,零知识虚拟机应运而生。',fontSize:13,order:5},
 {id:'r07',type:'paragraph',text:'如图 1 所示，完整的 zkVM 工作流程由前端执行与轨迹生成、后端证明生成两个主要阶段组成。',fontSize:13,order:6},
 {id:'r08',type:'figure',widthMode:'column',atomicH:200,caption:'图 1：zkVM 工作流程',order:7},
 {id:'r09',type:'paragraph',text:'目前硬件加速研究均只聚焦于计算密集的后端证明阶段。前端执行与轨迹生成阶段已占端到端证明时间的 20% 至 30%。',fontSize:13,order:8},
 {id:'r10',type:'section',text:'2 动机与相关工作',fontSize:14,order:9},
 {id:'r11',type:'section',text:'2.1 ZKP 瓶颈迁移现象',fontSize:13,order:10},
 {id:'r12',type:'paragraph',text:'后端加速器的成功使前端开销被急剧放大,成为新兴瓶颈。即便后端仅保守地实现 10 倍加速,前端占比也将飙升至 80% 以上。',fontSize:13,order:11},
 {id:'r13',type:'section',text:'2.2 zkVM 中的执行轨迹',fontSize:13,order:12},
 {id:'r14',type:'paragraph',text:'执行轨迹由主轨迹（Main Trace）与置换轨迹（Permutation Trace）组成。置换轨迹按公式 1 计算，其中 γ 与 β 为随机挑战值。',fontSize:13,order:13},
 {id:'r15',type:'equation',widthMode:'column',atomicH:60,label:'Permutation_i = 1 / (γ + Σ_j β^j A_ij)',order:14},
 {id:'r16',type:'section',text:'2.3 轨迹生成工作负载分析',fontSize:13,order:15},
 {id:'r17',type:'figure',widthMode:'column',atomicH:180,caption:'图 2：zkVM 轨迹生成流程',order:16},
 {id:'r18',type:'figure',widthMode:'column',atomicH:180,caption:'图 3：后端加速前（左）与后端加速后（右）的性能剖析',order:17},
 {id:'r19',type:'section',text:'3 设计与理念',fontSize:14,order:18},
 {id:'r20',type:'section',text:'3.1 架构与工作流程',fontSize:13,order:19},
 {id:'r21',type:'paragraph',text:'ZK-Tracer 被设计为异构计算单元,围绕主轨迹单元（Main Trace Unit, MTU）与并行的置换轨迹单元（Permutation Trace Units, PTUs）构建。',fontSize:13,order:20},
 {id:'r22',type:'section',text:'3.2 主轨迹单元（MTU）',fontSize:13,order:21},
 {id:'r23',type:'figure',widthMode:'span',atomicH:260,caption:'图 5：ZK-Tracer 架构',order:22},
 {id:'r24',type:'section',text:'3.3 置换轨迹单元（PTU）',fontSize:13,order:23},
 {id:'r25',type:'paragraph',text:'为确保跨表一致性,LogUp 协议要求生成置换轨迹。PTU 将整个计算分解为四级顺序级联的流水线。',fontSize:13,order:24},
];
function fakeMeasure(text,w,fs){const lh=fs*1.6,cpl=Math.max(1,Math.floor(w/(fs*1.05)));return Math.max(lh,Math.ceil([...text].length/cpl)*lh);}
const checks=[];
// 术语抽取(全角格式)
const allText=blocks.map(b=>b.text||'').join('\n');
const terms=PL.extractTerms(allText);
checks.push(['术语抽取>=6(zkVM/ZKP/MTU/PTUs/ASIC等)', terms.length>=6]);
checks.push(['含 zkVM 与 PTUs', terms.some(t=>t.abbr==='zkVM')&&terms.some(t=>t.abbr==='PTUs')]);
// 锚点抽取(章节+图题)
const anchors=ALB.extractAnchors(blocks);
const secLabels=anchors.filter(a=>a.kind==='section').map(a=>a.label);
const figLabels=anchors.filter(a=>a.kind==='caption').map(a=>a.label);
checks.push(['章节锚点完整(1/2/2.1/2.2/2.3/3/3.1/3.2/3.3)', JSON.stringify(secLabels)===JSON.stringify(['sec1','sec2','sec2.1','sec2.2','sec2.3','sec3','sec3.1','sec3.2','sec3.3'])]);
checks.push(['图题锚点 fig1/2/3/5 且不重不漏', JSON.stringify(figLabels)===JSON.stringify(['fig1','fig2','fig3','fig5'])]);
// 单栏分页(原中文译文为双栏 HTML,同时验证两种版式)
for(const mode of ['single','double']){
 const r=PG.paginate(blocks,{mode,measureText:fakeMeasure});
 const v=PG.validateOrder(blocks,r.log);
 checks.push([mode+' 分页:块序保持且页数>=2', v.ok===true&&r.pages.length>=2]);
}
const fails=checks.filter(c=>!c[1]);
document.getElementById('r').textContent=(fails.length?'FAIL '+fails.length+'\n':'ALL-PASS\n')+checks.map(c=>`${c[1]?'✅':'❌'} ${c[0]}`).join('\n')+'\nterms='+terms.map(t=>t.abbr||t.en).join(',')+'\nsec='+secLabels.join(',')+'\nfig='+figLabels.join(',');
</script>
</body>
</html>
