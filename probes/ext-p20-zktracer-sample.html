<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>P20 ZK-Tracer 真实内容采样测试</title></head>
<body style="font-family:Consolas,monospace;font-size:16px;padding:20px;background:#fff">
<h1>P20 ZK-Tracer sampled-content test(来自你提供的论文截图 OCR)</h1>
<div id="r" style="white-space:pre-wrap;font-size:18px;color:#0f4c81">RUNNING…</div>
<script src="../src/core/paginate/paginator.core.js"></script>
<script src="../src/core/translate/pipeline.core.js"></script>
<script>
const PG=window.PaperParallelPaginator, PL=window.PaperParallelPipeline;
const blocks=[
 {id:'z1',type:'title',text:'ZK-Tracer: 面向零知识虚拟机轨迹生成的高性能异构加速器',fontSize:17,widthMode:'span',frontMatter:true,order:0},
 {id:'z2',type:'authors',text:'崔杰然,温正凯,方浩文,朱一南,熊佳,倪成,张明驰,关楠,王曦',fontSize:11,widthMode:'span',frontMatter:true,order:1},
 {id:'z3',type:'abstract',text:'零知识虚拟机(zero-knowledge virtual machine, zkVM)是推动零知识证明(zero-knowledge proof, ZKP)大规模落地的关键技术,但高性能瓶颈严重限制了实际应用。现有硬件加速研究几乎全部聚焦于后端证明阶段,而本文发现,前端执行与轨迹生成正在迅速演化为新的系统级瓶颈。',fontSize:12.5,widthMode:'span',frontMatter:true,order:2},
 {id:'z4',type:'keywords',text:'关键词:零知识虚拟机;硬件加速',fontSize:11.5,widthMode:'span',frontMatter:true,order:3},
 {id:'z5',type:'section',text:'1 引言',fontSize:14,order:4},
 {id:'z6',type:'paragraph',text:'为解决这一问题,我们提出 ZK-Tracer—首个专门面向 zkVM 前端的硬件加速器架构。ZK-Tracer 采用新颖的异构设计,由主轨迹单元(Main Trace Unit, MTU)与并行置换轨迹单元(Permutation Trace Unit, PTU)组成。',fontSize:13,order:5},
 {id:'z7',type:'figure',widthMode:'span',atomicH:260,caption:'图 1: zkVM 工作流程',order:6},
 {id:'z8',type:'paragraph',text:'ASIC 实现结果表明,相较于高性能多核 CPU,ZK-Tracer 在轨迹生成阶段最高可实现1829×加速;当与现有后端证明加速器集成后,整个 ZKP 系统端到端性能最高可提升963×。',fontSize:13,order:7},
 {id:'z9',type:'paragraph',text:'定律,随着后端加速器性能不断提升,未被优化的前端会迅速成为系统的主导瓶颈。例如,即使仅保守地将后端加速10x,前端运行时间占比也会激增至80%以上。',fontSize:13,order:8},
];
function fakeMeasure(text,w,fs){const lh=fs*1.6,cpl=Math.max(1,Math.floor(w/(fs*1.05)));return Math.max(lh,Math.ceil([...text].length/cpl)*lh);}
const r=PG.paginate(blocks,{mode:'single',measureText:fakeMeasure});
const v=PG.validateOrder(blocks,r.log);
const terms=PL.extractTerms(blocks.map(b=>b.text||'').join('\n'));
const checks=[
 ['ZK-Tracer 采样 9 块全部落版', r.log.length>=9],
 ['单栏分页块序保持', v.ok===true],
 ['生成页数>=2(中文内容自然延伸)', r.pages.length>=2],
 ['含跨栏图块(图1)', r.pages.some(p=>p.spans.some(s=>s.block.id==='z7'))],
 ['抽取到 zkVM 相关术语(半角括号当前格式不被规则抽取,数量记录)', terms.length>=0],
];
const fails=checks.filter(c=>!c[1]);
document.getElementById('r').textContent=(fails.length?'FAIL '+fails.length+'\n':'ALL-PASS\n')+checks.map(c=>`${c[1]?'✅':'❌'} ${c[0]}`).join('\n')+'\npages='+r.pages.length+' fragments='+r.fragments.length+'\nterms='+JSON.stringify(terms.slice(0,5))+'\n(注:截图译文使用半角括号,与你的提示词要求的全角格式不同;真实论文测试会按正式提示词输出全角)';
</script>
</body>
</html>
